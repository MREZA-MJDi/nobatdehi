name: NOBAT CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nobat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend + Frontend + Integration
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: "null"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, curl
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Create application key
        run: php artisan key:generate --force

      - name: PHP syntax check
        shell: bash
        run: |
          find app bootstrap config database routes tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

      - name: Verify Laravel boots and routes compile
        run: |
          php artisan about --only=environment
          php artisan route:list --except-vendor

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run application tests
        run: php artisan test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify generated frontend manifest
        run: test -f public/build/manifest.json

      - name: Verify production Laravel caches
        run: |
          php artisan config:cache
          php artisan view:cache
